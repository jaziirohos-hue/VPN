# Runs the Xalane API behind Caddy, which gets a free HTTPS certificate automatically.
# 1. Point a DNS name (e.g. api.xalane.com) at this server.
# 2. Copy .env.example to .env and fill it in.
# 3. docker compose up -d
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    # Reachable from this machine only, so a VPN node on the same server can use http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - xalane-data:/data
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
volumes:
  xalane-data:
  caddy-data:
